name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Entraîner le modèle
        run: |
          python src/train_model.py

      - name: Quality Gate
        run: |
          pytest tests/test_model_quality.py -v
          pytest tests/test_api.py -v

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: diabetes_risk_model.pkl



  build-and-push:
    needs: test

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download model
        uses: actions/download-artifact@v4
        with:
          name: trained-model

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/diabetes-prediction:latest .

      - name: Push image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/diabetes-prediction:latest

      - name: Smoke test
        run: |
          docker run -d -p 8000:8000 --name api \
            ghcr.io/${{ github.repository_owner }}/diabetes-prediction:latest

          sleep 15

          curl http://localhost:8000/health

          