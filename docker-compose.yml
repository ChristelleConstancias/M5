services:
  # --- Pré-configuré : ne pas modifier la partie tracking, seulement l'utiliser ---
  # Utilisé dès le Jour 1 pour le tracking et le Model Registry MLflow.
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.1
    container_name: diabetes-mlflow
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- À compléter par vous : Jour 3 (Dockerfile) ---
